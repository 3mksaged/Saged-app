name: sajid_family_app
description: "تطبيق منظومة الإدارة الأسرية - إعداد المبرمج ساجد"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # مكتبة حفظ البيانات التلقائية على ذاكرة الهاتف
  shared_preferences: ^2.2.2
  
  # آيقونات الماتيريال المتقدمة
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: "^0.13.1"

flutter:
  uses-material-design: true

flutter_launcher_icons:
  image_path: "assets/icon/app_icon.png"
  android: true
  ios: true
  image_path_android: "assets/icon/app_icon.png"
